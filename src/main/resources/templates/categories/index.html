<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Loại khóa học')}"></head><body><header th:replace="~{fragments :: header}"></header><main>
<div class="page-heading"><div><p class="eyebrow">DANH MỤC ĐÀO TẠO</p><h1>Loại khóa học</h1><p class="muted">Một loại có thể chứa nhiều khóa học.</p></div><a class="btn" th:href="@{/categories/create}">+ Thêm loại</a></div><div th:replace="~{fragments :: alerts}"></div>
<section class="panel"><div class="empty" th:if="${#lists.isEmpty(categories)}">Chưa có loại khóa học.</div><div class="table-wrap" th:unless="${#lists.isEmpty(categories)}"><table><thead><tr><th>ID</th><th>Tên loại</th><th>Mô tả</th><th>Thao tác</th></tr></thead><tbody><tr th:each="cat:${categories}"><td th:text="${cat.id}"></td><td><a class="course-title" th:href="@{/courses(categoryId=${cat.id})}" th:text="${cat.name}"></a></td><td th:text="${cat.description}"></td><td><div class="row-actions"><a th:href="@{/categories/{id}/edit(id=${cat.id})}">Sửa</a><form method="post" th:action="@{/categories/{id}/delete(id=${cat.id})}" onsubmit="return confirm('Xóa loại khóa học này?')"><button class="link danger" type="submit">Xóa</button></form></div></td></tr></tbody></table></div><p class="muted">Loại đang có khóa học sẽ không được phép xóa.</p></section>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
