<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Thông tin loại khóa học')}"></head><body><header th:replace="~{fragments :: header}"></header><main class="narrow">
<a class="back" th:href="@{/categories}">← Các loại khóa học</a><div class="page-heading"><h1 th:text="${categoryId == null ? 'Thêm loại khóa học' : 'Sửa loại khóa học'}"></h1></div>
<section class="panel"><form method="post" th:action="${categoryId == null ? '/categories/create' : '/categories/' + categoryId + '/edit'}" th:object="${form}"><div class="alert error" th:if="${#fields.hasAnyErrors()}" th:errors="*{all}" role="alert"></div>
<label>Tên loại *<input th:field="*{name}" required maxlength="120"></label><label>Mô tả<textarea th:field="*{description}" maxlength="2000" rows="5"></textarea></label><div class="actions"><button class="btn" type="submit">Lưu loại</button><a class="btn secondary" th:href="@{/categories}">Hủy</a></div></form></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
