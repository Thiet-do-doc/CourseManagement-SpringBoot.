<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Chi tiết khóa học')}"></head><body><header th:replace="~{fragments :: header}"></header><main>
<a class="back" th:href="@{/courses}">← Danh sách khóa học</a><div class="page-heading"><div><p class="eyebrow" th:text="${course.category.name}"></p><h1 th:text="${course.name}"></h1></div><a class="btn" th:href="@{/courses/{id}/edit(id=${course.id})}">Chỉnh sửa</a></div>
<div th:replace="~{fragments :: alerts}"></div><section class="panel detail-top"><div><img class="hero-image" th:src="${course.thumbnail != null ? course.thumbnail.imageUrl : '/images/placeholder.svg'}" alt="Ảnh đại diện khóa học" onerror="this.onerror=null;this.src='/images/placeholder.svg'"><p class="muted" th:if="${course.thumbnail == null}">Chưa chọn ảnh đại diện.</p></div><div>
<span class="badge" th:classappend="${course.active ? 'active' : 'inactive'}" th:text="${course.active ? 'Đang tuyển sinh' : 'Ngừng tuyển sinh'}"></span>
<p class="price" th:text="${#numbers.formatDecimal(course.tuitionFee,1,'POINT',0,'COMMA')} + ' đ'"></p><p><strong th:text="${course.duration} + ' giờ'"></strong> · <span th:text="${course.durationType}"></span></p>
<p class="description" th:text="${#strings.isEmpty(course.description) ? 'Chưa có mô tả.' : course.description}"></p></div></section>
<section class="panel"><div class="section-heading"><h2>Thư viện ảnh</h2><span class="count" th:text="${#lists.size(course.images)} + ' ảnh'"></span></div>
<div class="empty" th:if="${#lists.isEmpty(course.images)}">Khóa học chưa có ảnh. Thêm URL ảnh ở form bên dưới.</div>
<div class="gallery"><article class="image-card" th:each="img:${course.images}"><img th:src="${img.imageUrl}" alt="Ảnh khóa học" onerror="this.onerror=null;this.src='/images/placeholder.svg'"><div class="image-body"><span class="badge" th:classappend="${img.thumbnail ? 'active' : 'inactive'}" th:text="${img.thumbnail ? 'Ảnh đại diện' : 'Ảnh thường'}"></span><a class="image-url" th:href="${img.imageUrl}" target="_blank" rel="noopener noreferrer" th:text="${img.imageUrl}"></a><div class="row-actions">
<form th:unless="${img.thumbnail}" method="post" th:action="@{/courses/{id}/images/{imageId}/thumbnail(id=${course.id},imageId=${img.id})}"><button class="btn small" type="submit">Đặt làm đại diện</button></form>
<form method="post" th:action="@{/courses/{id}/images/{imageId}/delete(id=${course.id},imageId=${img.id})}" onsubmit="return confirm('Xóa ảnh này?')"><button class="link danger" type="submit">Xóa ảnh</button></form></div></div></article></div></section>
<section class="panel"><h2>Thêm ảnh bằng URL</h2><p class="muted">Dùng đường dẫn trực tiếp đến ảnh, bắt đầu bằng http:// hoặc https://.</p><form method="post" th:action="@{/courses/{id}/images(id=${course.id})}" th:object="${imageForm}">
<div class="alert error" th:if="${#fields.hasAnyErrors()}" th:errors="*{all}" role="alert"></div>
<label>URL ảnh *<input type="url" th:field="*{imageUrl}" required maxlength="2000" placeholder="http://localhost:8080/images/iot.svg"></label>
<label class="check"><input type="checkbox" th:field="*{thumbnail}"> Đặt ảnh mới làm đại diện (ảnh cũ tự chuyển thành ảnh thường)</label><button class="btn" type="submit">Thêm ảnh</button></form></section>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
