# Set DB_PASSWORD in your terminal. Do not commit a real password.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=CourseManagement;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:course_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.h2.console.enabled=false
